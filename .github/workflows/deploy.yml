name: Nuxt Deployment

on:
  push:
    branches:
      - main # 如果你的主分支是 main，请改为 main

jobs:
  build-and-deploy:
    # 对应你之前确认的 Idle 状态的标签
    runs-on: windows-deploy

    steps:
      # 1. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # 根据你的项目需求可改为 16 或 20
          cache: 'npm'

      # 3. 安装依赖并构建项目
      - name: Build Nuxt Project
        run: |
          npm install
          npm run build

      # 4. 部署与同步 (使用 PowerShell)
      - name: Deploy to Server
        shell: pwsh
        run: |
          $TARGET_DIR = "D:\order\web"
          
          echo "开始同步编译产物到 $TARGET_DIR\.output"
          
          # 确保目标目录存在
          if (!(Test-Path $TARGET_DIR)) { New-Item -ItemType Directory -Force -Path $TARGET_DIR }

          # 同步 .output 文件夹
          # /MIR 镜像目录（会删除目标目录中多余的文件），/MT:16 多线程
          robocopy ".output" "$TARGET_DIR\.output" /MIR /MT:16
          
          # Robocopy 成功退出码处理 (1-3 视为成功)
          if ($LASTEXITCODE -le 3) { $global:LASTEXITCODE = 0 }

          # 同步配置文件（假设它们在仓库的 web 目录下）
          if (Test-Path "web\web.config") { 
              Copy-Item "web\web.config" "$TARGET_DIR\" -Force 
          }
          if (Test-Path "web\ecosystem.config.cjs") { 
              Copy-Item "web\ecosystem.config.cjs" "$TARGET_DIR\" -Force 
          }

          # 5. 重启 PM2 进程
          echo "正在通过 PM2 重启应用..."
          cd $TARGET_DIR
          pm2 reload ecosystem.config.cjs --env production